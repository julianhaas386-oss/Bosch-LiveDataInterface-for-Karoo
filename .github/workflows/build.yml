name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        env:
          # GitHub Packages auth for io.hammerhead:karoo-ext
          # Add GPR_USER and GPR_KEY as Repository Secrets.
          # GPR_KEY = Personal Access Token with 'read:packages' scope.
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}

      - name: Run Lint
        run: ./gradlew lintDebug
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME:-debug}"
          mkdir -p app/build/outputs/apk/renamed
          cp app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/renamed/bosch-ldi-${VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bosch-ldi-apk
          path: app/build/outputs/apk/renamed/*.apk
          retention-days: 7

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: bosch-ldi-apk
          path: apk/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
