name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      # Tag builds become public releases — never let one ship unsigned/debug-signed.
      - name: Fail tag builds without signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ ! -s app/release.keystore ] || [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ]; then
            echo "::error::Release signing secrets missing — refusing to build a release tag unsigned."
            exit 1
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}

      - name: Run Lint
        run: ./gradlew lintRelease
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}

      - name: Prepare release assets
        run: |
          mkdir -p app/build/outputs/release-assets
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/release-assets/app-release.apk

          # R8 mapping must ship with every release or field crashes are undeobfuscatable.
          cp app/build/outputs/mapping/release/mapping.txt \
             app/build/outputs/release-assets/mapping.txt

          VERSION_CODE=$(grep -m1 -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          VERSION_NAME=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="${GITHUB_REF_NAME:-}"
          VERSION="${TAG#v}"

          # On tag builds the tag must match gradle's versionName; elsewhere use versionName.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "$VERSION" != "$VERSION_NAME" ]; then
              echo "::error::Tag v${VERSION} does not match versionName ${VERSION_NAME} in build.gradle.kts."
              exit 1
            fi
          else
            VERSION="$VERSION_NAME"
          fi

          cat > app/build/outputs/release-assets/manifest.json << EOF
          {
            "label": "Bosch LiveDataInterface",
            "packageName": "de.dxmedia.bosch.ldi",
            "iconUrl": "https://github.com/julianhaas386-oss/Bosch-LiveDataInterface-for-Karoo/releases/latest/download/icon.png",
            "latestApkUrl": "https://github.com/julianhaas386-oss/Bosch-LiveDataInterface-for-Karoo/releases/latest/download/app-release.apk",
            "latestVersion": "${VERSION}",
            "latestVersionCode": ${VERSION_CODE},
            "developer": "dxmedia.de",
            "description": "Shows live Bosch eBike data - speed, cadence, rider power, battery SOC, odometer and more - directly on your Hammerhead Karoo 2 or 3.",
            "releaseNotes": "See https://github.com/julianhaas386-oss/Bosch-LiveDataInterface-for-Karoo/releases/tag/v${VERSION}"
          }
          EOF

          python3 -m json.tool app/build/outputs/release-assets/manifest.json > /dev/null \
            || { echo "::error::Generated manifest.json is not valid JSON."; exit 1; }

          cp icon.png app/build/outputs/release-assets/icon.png

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: app/build/outputs/release-assets/
          retention-days: 7

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
